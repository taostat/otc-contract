[package]
name = "otc-shared"
version = "0.1.0"
authors = ["taostats <dev@taostats.io>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2503-6", default-features = false, features = ["disable_panic_handler", "disable_oom", "disable_allocator"] }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2503-6", default-features = false }
fixed = { version = "=1.27.0", default-features = false }

[features]
default = ["std"]
std = [
    "ink/std",
    "sp-runtime/std",
    "sp-io/std",
    "fixed/std",
]
