[package]
name = "alpha-lockup"
version = "0.1.0"
authors = ["taostats <dev@taostats.io>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
otc-shared = { path = "../../shared", default-features = false }
code-registry = { path = "../code_registry", default-features = false, features = ["ink-as-dependency"] }

[dev-dependencies]
otc-shared = { path = "../../shared", features = ["testing", "storage-layout"] }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "otc-shared/std",
    "code-registry/std",
]
ink-as-dependency = []
# Test builds only: a second escrow code with a newer storage version, so
# integration tests have real code to upgrade escrows to.
upgrade-test = []
