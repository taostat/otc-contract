[package]
name = "alpha-lockup"
version = "0.1.0"
authors = ["taostats <dev@taostats.io>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
otc-shared = { path = "../../shared", default-features = false }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "otc-shared/std",
]
ink-as-dependency = []
