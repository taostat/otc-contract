[package]
name = "otc_contract"
version = "0.2.0"
authors = ["taostats <dev@taostats.io>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
otc-shared = { path = "../../shared", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2503-6", default-features = false }
fixed = { version = "=1.30.0", default-features = false }

[dev-dependencies]
ink_e2e = { version = "5.1.1" }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "otc-shared/std",
    "sp-runtime/std",
    "fixed/std",
]
ink-as-dependency = []
e2e-tests = []
