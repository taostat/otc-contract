[package]
name = "listing-vault"
version = "0.1.0"
authors = ["taostats <dev@taostats.io>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
otc-shared = { path = "../../shared", default-features = false }
alpha-lockup = { path = "../alpha_lockup", default-features = false, features = ["ink-as-dependency"] }
code-registry = { path = "../code_registry", default-features = false, features = ["ink-as-dependency"] }

[dev-dependencies]
otc-shared = { path = "../../shared", features = ["testing", "storage-layout"] }
fixed = { version = "=1.27.0", default-features = false }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "otc-shared/std",
    "alpha-lockup/std",
    "code-registry/std",
]
ink-as-dependency = []
# Test builds only: a second vault code with a newer storage version and an
# added storage field, so integration tests can upgrade vaults across a layout
# change.
upgrade-test = []
