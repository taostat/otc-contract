[package]
name = "lockup-listings"
version = "0.1.0"
authors = ["taostats <dev@taostats.io>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
otc-shared = { path = "../../shared", default-features = false }
listing-vault = { path = "../listing_vault", default-features = false, features = ["ink-as-dependency"] }
code-registry = { path = "../code_registry", default-features = false, features = ["ink-as-dependency"] }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "otc-shared/std",
    "listing-vault/std",
    "code-registry/std",
]
ink-as-dependency = []
